services:
  # 🌐 Frontend - Statische site
  - type: web
    name: autosite-frontend
    rootDir: frontend
    env: static
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: API_URL
        value: https://autosite-api.onrender.com  # ← vul hier je backend-URL in zodra gedeployed

  # 🗄️ Database - PostgreSQL via Docker image
  - type: pserv
    name: autosite-db
    env: docker
    plan: free
    region: oregon
    image: postgres:14
    envVars:
      - key: POSTGRES_DB
        value: autosite
      - key: POSTGRES_USER
        value: autosite_user
      - key: POSTGRES_PASSWORD
        generateValue: true
    startCommand: docker-entrypoint.sh postgres

  # ⚙️ Backend - Node.js API
  - type: web
    name: autosite-api
    rootDir: backend
    env: node
    plan: free
    numInstances: 1
    buildCommand: |
      npm install
      npm run build
      if [ -f collection.csv ]; then
        cp collection.csv dist/
      elif [ -f ../collection.csv ]; then
        cp ../collection.csv dist/
      else
        echo "Warning: collection.csv not found"
      fi
    startCommand: node dist/main.js
    envVars:
      - key: DATABASE_URL
        value: postgres://autosite_user:${POSTGRES_PASSWORD}@autosite-db:5432/autosite
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
