services:
  # 🌐 Frontend - Statische site
  - type: web
    name: autosite-frontend
    rootDir: frontend
    env: static
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: autosite-api
          property: url

  # 🗄️ Database - PostgreSQL via private service
  - type: pserv
    name: autosite-db
    env: postgres
    plan: free
    region: oregon

  # ⚙️ Backend - Node.js API
  - type: web
    name: autosite-api
    rootDir: backend
    env: node
    plan: free
    numInstances: 1
    buildCommand: |
      npm install
      npm run build
      if [ -f collection.csv ]; then
        cp collection.csv dist/
      elif [ -f ../collection.csv ]; then
        cp ../collection.csv dist/
      else
        echo "Warning: collection.csv not found"
      fi
    startCommand: node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autosite-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
