services:
  # Een statische site voor gebruikers (de frontend)
  - type: static_site
    name: autosite-frontend
    env: static
    rootDir: .
    # Stelt de omgeving in voor pnpm, wat nodig kan zijn voor statische assets.
    buildCommand: pnpm install --store=node_modules/.pnpm --production=false
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    envVars:
      # Haalt de API URL automatisch op van de backend service
      - key: API_URL
        fromService: autosite-api
  
  # Een privé PostgreSQL database
  - type: pserv
    name: autosite-db
    region: oregon # Render raadt aan een vaste regio in te stellen
    ipAllowList: [] # Laat enkel interne verbindingen toe
    plan: free
    disk:
      size: 10 # GB
      name: ps-disk

  # Een Node.js web service voor de API (de backend)
  - type: web
    name: autosite-api
    rootDir: backend
    env: node
    port: 3000
    plan: free
    numInstances: 1
    # De complexe shell-opdracht is correct tussen dubbele aanhalingstekens geplaatst.
    buildCommand: "cd backend && npm install && npm run build && (test -f collection.csv && cp collection.csv dist/ || test -f ../collection.csv && cp ../collection.csv dist/ || echo \"Warning: collection.csv not found\")"
    startCommand: node dist/main.js
    envVars:
      # Koppelt de backend automatisch aan de database
      - key: DATABASE_URL
        fromDatabase: autosite-db
        type: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true # Genereert automatisch een beveiligde sleutel
