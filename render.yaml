services:
  # 🌐 Frontend - Statische site
  - type: static_site
    name: autosite-frontend
    rootDir: frontend
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: API_URL
        fromService: autosite-api

  # 🗄️ Database - PostgreSQL
  - type: pserv
    name: autosite-db
    plan: free
    region: oregon
    ipAllowList: [] # Enkel interne verbindingen
    disk:
      name: ps-disk
      sizeGB: 10

  # ⚙️ Backend - Node.js API
  - type: web
    name: autosite-api
    rootDir: backend
    env: node
    plan: free
    numInstances: 1
    port: 3000
    buildCommand: |
      npm install
      npm run build
      if [ -f collection.csv ]; then
        cp collection.csv dist/
      elif [ -f ../collection.csv ]; then
        cp ../collection.csv dist/
      else
        echo "Warning: collection.csv not found"
      fi
    startCommand: node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: autosite-db
        type: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
